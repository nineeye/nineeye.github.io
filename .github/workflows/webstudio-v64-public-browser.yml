name: WebStudio Public Browser QA

on:
  push:
    branches:
      - main
    paths:
      - 'webstudio/**'
      - '.github/workflows/webstudio-v64-public-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webstudio-public-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-public-browser:
    name: Windows Edge public site and six-sector inquiry
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Read-only source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify six-sector CDP and fail-closed protocol
        shell: pwsh
        run: |
          python -m unittest discover -s webstudio/tools -p test_v65_edge_protocol.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify 36 samples / 12 sector requirements and JavaScript parse
        shell: pwsh
        run: |
          node --check webstudio/assets/v652-sector-requirements.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s webstudio/tools -p test_v652_sector_requirements.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify V65.3 buyer price/scope/contract handoff (offline and syntax)
        shell: pwsh
        run: |
          node --check webstudio/assets/v653-sales-bridge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s webstudio/tools -p test_v653_sales_bridge.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require exact published V65.3 buyer assets before live checks
        shell: pwsh
        run: |
          $origin = 'https://allfileone-webstudio.pages.dev'
          $ready = $false
          # Cloudflare Pages can lag GitHub main by a few minutes.
          # No V65.3 PASS is allowed for a published V65.2 or stale asset.
          for ($i=0; $i -lt 45; $i++) {
            try {
              $headers = @{ 'Cache-Control'='no-cache'; 'Pragma'='no-cache' }
              $manifest = Invoke-RestMethod -Uri "$origin/assets/current-release.json" -TimeoutSec 10 -Headers $headers
              $v65 = $manifest.version -eq 'V65' -and $manifest.release_id -eq 'WEBSTUDIO-V65-20261108'
              $v653 = $manifest.v653_patch_date -eq '2026-11-09' -and $manifest.v653_buyers_demo_to_pricing_to_consult -eq $true
              if (-not ($v65 -and $v653)) {
                Write-Host 'Cloudflare release is still prior to exact V65.3 buyer features.'
              } else {
                $demo = Invoke-WebRequest -Uri "$origin/assets/v652-sector-requirements.js" -TimeoutSec 10 -Headers $headers
                $sales = Invoke-WebRequest -Uri "$origin/assets/v653-sales-bridge.js" -TimeoutSec 10 -Headers $headers
                if ($demo.StatusCode -eq 200 -and $sales.StatusCode -eq 200 -and
                    $demo.Content.Contains('v653-to-plan') -and
                    $sales.Content.Contains('window.AFO_V653_TERMS_COUNT=TERMS.length')) {
                  Write-Host 'EXACT_V65_3_PUBLIC_MANIFEST_AND_BOTH_JAVASCRIPTS_VERIFIED'
                  $ready = $true
                  break
                }
                Write-Host 'Manifest is current, but the public buyer JS is not verified yet.'
              }
            } catch {
              Write-Host 'Public Cloudflare assets not available yet; no pass claimed.'
            }
            Start-Sleep -Seconds 8
          }
          if (-not $ready) { throw 'HOLD: Exact V65.3 public buyer assets not proven; refusing stale-site UI success claims.' }

      - name: Read-only real Edge browser smoke (PC and mobile, six industries)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'AFO_V65_PUBLIC_BROWSER_QA'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          python webstudio/tools/v65_edge_live_qa.py --output "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real Windows Edge 36-design and 12-industry buyer flow acceptance
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'AFO_V65_PUBLIC_BROWSER_QA'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          python webstudio/tools/v652_live_demo_qa.py --output "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real Edge 12 industries buyer demonstration to price to precontract consultation
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'AFO_V65_PUBLIC_BROWSER_QA'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          python webstudio/tools/v653_live_sales_qa.py --output "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package full deployable site source plus QA evidence even on HOLD
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'AFO_V65_PUBLIC_BROWSER_QA'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          python webstudio/tools/v65_bundle_release.py --source webstudio --evidence-dir "$out" --out-dir "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach public-page evidence even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AllFileOne_WebStudio_V65_Public_Browser_Evidence
          path: ${{ runner.temp }}/AFO_V65_PUBLIC_BROWSER_QA/
          if-no-files-found: warn
          retention-days: 1
