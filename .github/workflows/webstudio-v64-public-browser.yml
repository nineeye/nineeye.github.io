name: WebStudio V82 public release audit (zero-cost standard public runner)

on:
  push:
    branches: [main]
    paths:
      - 'webstudio/**'
      - '.github/workflows/webstudio-v64-public-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webstudio-public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-v82-public-proof:
    name: V82 source, publish package, and real HTTPS asset probe
    runs-on: windows-2025
    timeout-minutes: 14
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out canonical main source without token persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run all current and historical source regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s webstudio/tools -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v82-release-check.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v81-production-scope.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v85-experience.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Cloudflare site-only zip rooted at index.html
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          python webstudio/tools/v82_publish_bundle.py --root webstudio --output "$dir/AllFileOne_WebStudio_V82_PublishOnly.zip" --report "$dir/V82_SITE_PACKAGE_MANIFEST.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: V83 read-only public origin diagnosis (keeps HOLD evidence)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v83_public_diagnostics.py --output "$dir"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit $LASTEXITCODE }
          exit 0

      - name: V84 showroom public proof (capture HOLD without skipping old baseline)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v84_public_showroom_probe.py --output "$dir"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit $LASTEXITCODE }
          exit 0

      - name: Check exact V82 public Cloudflare files read-only (HOLD on unavailable/stale)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v82_live_public_probe.py --output "$dir" --max-attempts 6 --retry-seconds 10
          if ($LASTEXITCODE -ne 0) { throw 'HOLD: Exact V82 public assets not proven; no email receipt claims.' }

      - name: V84 live showroom must be published (no false success)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $record = Join-Path $dir 'AFO_V84_PUBLIC_SHOWROOM.json'
          if (!(Test-Path $record)) { throw 'HOLD: V84 live showroom evidence is missing.' }
          $proof = Get-Content $record -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($proof.result -ne 'PASS_V84_PUBLIC_FILES_ONLY') {
            throw ('HOLD: V84 live showroom has not been fully published (' + $proof.passed + '/' + $proof.total + ').')
          }

      - name: V85 44 published asset contracts with retry and full Korean evidence
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            python webstudio/tools/v85_public_probe.py --output "$dir"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($i -lt 6) { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw 'HOLD: V85 exact 44 public assets are not all published.' }

      - name: V85 real Windows Edge browser, 12 sectors x 3 styles x PC/mobile and iframe proof
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v85_edge_browser_qa.py --output "$dir"
          if ($LASTEXITCODE -ne 0) { throw 'HOLD: V85 live Edge interaction or iframe proof failed. See AFO_V85_REAL_EDGE_KO.txt.' }

      - name: Upload source and public site evidence even when Cloudflare is HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AFO_WebStudio_V82_Public_Release_Evidence
          path: ${{ runner.temp }}/AFO_WebStudio_V82_Evidence/
          if-no-files-found: warn
          retention-days: 1