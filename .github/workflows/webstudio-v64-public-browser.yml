name: WebStudio V82 public release audit (zero-cost standard public runner)

on:
  push:
    branches: [main]
    paths:
      - 'webstudio/**'
      - '.github/workflows/webstudio-v64-public-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webstudio-public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-v82-public-proof:
    name: V82 source, publish package, and real HTTPS asset probe
    runs-on: windows-2025
    timeout-minutes: 14
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out canonical main source without token persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run all current and historical source regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s webstudio/tools -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v82-release-check.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v81-production-scope.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v85-experience.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v86-guide.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v87-inquiry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v88-mail-fallback.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v89-home.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v90-process.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v91-quote.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check webstudio/assets/v88-launch-check.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Cloudflare site-only zip rooted at index.html
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          python webstudio/tools/v82_publish_bundle.py --root webstudio --output "$dir/AllFileOne_WebStudio_V82_PublishOnly.zip" --report "$dir/V82_SITE_PACKAGE_MANIFEST.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: V83 read-only public origin diagnosis (keeps HOLD evidence)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v83_public_diagnostics.py --output "$dir"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit $LASTEXITCODE }
          exit 0

      - name: V84 showroom public proof (capture HOLD without skipping old baseline)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v84_public_showroom_probe.py --output "$dir"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit $LASTEXITCODE }
          exit 0

      - name: Check exact V82 public Cloudflare files read-only (HOLD on unavailable/stale)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v82_live_public_probe.py --output "$dir" --max-attempts 6 --retry-seconds 10
          if ($LASTEXITCODE -ne 0) { throw 'HOLD: Exact V82 public assets not proven; no email receipt claims.' }

      - name: V84 live showroom must be published (no false success)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $record = Join-Path $dir 'AFO_V84_PUBLIC_SHOWROOM.json'
          if (!(Test-Path $record)) { throw 'HOLD: V84 live showroom evidence is missing.' }
          $proof = Get-Content $record -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($proof.result -ne 'PASS_V84_PUBLIC_FILES_ONLY') {
            throw ('HOLD: V84 live showroom has not been fully published (' + $proof.passed + '/' + $proof.total + ').')
          }

      - name: V85 read-only live 44-file proof on Cloudflare and owner GitHub Pages fallback
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $dir 'V85_CLOUDFLARE'
          $github = Join-Path $dir 'V85_GITHUB_PAGES'
          python webstudio/tools/v85_public_probe.py --output "$cloud" --origin "https://allfileone-webstudio.pages.dev/"
          $cloudOk = ($LASTEXITCODE -eq 0)
          $pagesOk = $false
          for ($i = 1; $i -le 5; $i++) {
            python webstudio/tools/v85_public_probe.py --output "$github" --origin "https://nineeye.github.io/webstudio/"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true; break }
            if ($i -lt 5) { Start-Sleep -Seconds 8 }
          }
          if (-not $cloudOk -and -not $pagesOk) {
            throw 'HOLD: Neither Cloudflare nor the owner GitHub Pages deployment passed V85 exact 44-file read-only checks.'
          }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V85_PUBLIC_ORIGIN=$origin"
          Write-Host ("V85 exact public assets proven at: " + $origin)
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_ONLY: Cloudflare Pages still serves an earlier version. GitHub Pages fallback is independent.' }

      - name: V85 real Windows Edge public browser with 12 x 3 x PC/mobile, iframes and screenshots
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          python webstudio/tools/v85_edge_browser_qa.py --output "$dir" --origin "$env:V85_PUBLIC_ORIGIN"
          if ($LASTEXITCODE -ne 0) { throw 'HOLD: V85 Windows Edge actual public browser or iframe smoke failed. Read AFO_V85_REAL_EDGE_KO.txt.' }

      - name: V86 twelve sector buyer guides exact 18-file live public proof
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $root 'V86_CLOUDFLARE'
          $pages = Join-Path $root 'V86_GITHUB_PAGES'
          $cloudOk = $false
          $pagesOk = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            python webstudio/tools/v86_public_probe.py --origin 'https://allfileone-webstudio.pages.dev/' --output "$cloud"
            if ($LASTEXITCODE -eq 0) { $cloudOk = $true }
            python webstudio/tools/v86_public_probe.py --origin 'https://nineeye.github.io/webstudio/' --output "$pages"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true }
            if ($cloudOk -or $pagesOk) { break }
            if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
          }
          if (-not $cloudOk -and -not $pagesOk) {
            throw 'HOLD: Neither owned origin serves the exact V86 18-file buyer guides.'
          }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V86_PUBLIC_ORIGIN=$origin"
          Write-Host ("V86 genuine public files proven at: " + $origin)
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_ONLY: independent GitHub Pages fallback was verified, not Cloudflare.' }
          if (-not $pagesOk) { Write-Host 'HOLD_GITHUB_PAGES_ONLY: Cloudflare passed, GitHub Pages result is independent.' }

      - name: V86 real Windows Edge 12 industries PC-mobile goals styles and checklist
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $out = Join-Path $root 'V86_WINDOWS_EDGE'
          python webstudio/tools/v86_edge_browser_qa.py --origin "$env:V86_PUBLIC_ORIGIN" --output "$out"
          if ($LASTEXITCODE -ne 0) { throw 'HOLD: Real V86 public Edge browser sector goals/style/readiness failed; see V86_WINDOWS_EDGE/AFO_V86_REAL_EDGE_KO.txt.' }

      - name: V87 customer-request honest 23-file public proof on Cloudflare and GitHub Pages
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $root 'V87_CLOUDFLARE'
          $pages = Join-Path $root 'V87_GITHUB_PAGES'
          $cloudOk = $false
          $pagesOk = $false
          for ($attempt=1; $attempt -le 6; $attempt++) {
            python webstudio/tools/v87_public_probe.py --origin 'https://allfileone-webstudio.pages.dev/' --output "$cloud"
            if ($LASTEXITCODE -eq 0) { $cloudOk = $true }
            python webstudio/tools/v87_public_probe.py --origin 'https://nineeye.github.io/webstudio/' --output "$pages"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true }
            if ($cloudOk -or $pagesOk) { break }
            if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
          }
          if (-not $cloudOk -and -not $pagesOk) {
            throw 'HOLD: Neither public host serves the V87 23 exact files.'
          }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V87_PUBLIC_ORIGIN=$origin"
          Write-Host ("V87 verified public origin: " + $origin)
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_ONLY: GitHub Pages independently passed.' }
          if (-not $pagesOk) { Write-Host 'HOLD_GITHUB_PAGES_ONLY: Cloudflare independently passed.' }
          exit 0  # GitHub Pages may still be stale; Cloudflare passed, do not leak last Python exit code 3.

      - name: V87 actual Windows Edge 12x3xPC-mobile inquiry, 8 functions and honest email intent
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $out = Join-Path $root 'V87_WINDOWS_EDGE'
          $passed = $false
          for ($try = 1; $try -le 2; $try++) {
            python webstudio/tools/v87_edge_browser_qa.py --origin "$env:V87_PUBLIC_ORIGIN" --output "$out"
            if ($LASTEXITCODE -eq 0) { $passed = $true; break }
            Write-Host ("V87 retryable public Edge HOLD attempt " + $try + ": evidence saved; will rerun only once on a fresh isolated profile.")
            if ($try -lt 2) { Start-Sleep -Seconds 3 }
          }
          if (-not $passed) { throw 'HOLD: V87 real public Edge inquiry flow failed twice; see AFO_V87_WINDOWS_EDGE_KO.txt.' }

      - name: V88 exact 9-file public proof — Cloudflare and independent GitHub Pages
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $root 'V88_CLOUDFLARE'
          $pages = Join-Path $root 'V88_GITHUB_PAGES'
          $cloudOk = $false
          $pagesOk = $false
          for ($attempt=1; $attempt -le 6; $attempt++) {
            python webstudio/tools/v88_public_probe.py --origin 'https://allfileone-webstudio.pages.dev/' --output "$cloud"
            if ($LASTEXITCODE -eq 0) { $cloudOk = $true }
            python webstudio/tools/v88_public_probe.py --origin 'https://nineeye.github.io/webstudio/' --output "$pages"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true }
            if ($cloudOk -or $pagesOk) { break }
            if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
          }
          if (-not $cloudOk -and -not $pagesOk) { throw 'HOLD: V88 exact nine public assets have not been published at either owned origin.' }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V88_PUBLIC_ORIGIN=$origin"
          Write-Host ("V88 verified public origin: " + $origin)
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_ONLY: Independent GitHub Pages V88 passed.' }
          if (-not $pagesOk) { Write-Host 'HOLD_GITHUB_PAGES_ONLY: Independent Cloudflare V88 passed.' }
          exit 0

      - name: V88 actual Windows Edge manual mail fallback + operator 30-point evidence
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $out = Join-Path $root 'V88_WINDOWS_EDGE'
          python webstudio/tools/v88_edge_public_qa.py --origin "$env:V88_PUBLIC_ORIGIN" --output "$out"
          if ($LASTEXITCODE -ne 0) { throw 'HOLD: V88 actual public Edge manual mail fallback or owner checklist failed. See V88_WINDOWS_EDGE/AFO_V88_WINDOWS_EDGE_KO.txt.' }

      - name: V89 strict 10-file public homepage release checks Cloudflare and GitHub Pages
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $root 'V89_CLOUDFLARE'
          $pages = Join-Path $root 'V89_GITHUB_PAGES'
          $cloudOk = $false
          $pagesOk = $false
          for ($attempt=1; $attempt -le 6; $attempt++) {
            python webstudio/tools/v89_public_probe.py --origin 'https://allfileone-webstudio.pages.dev/' --output "$cloud"
            if ($LASTEXITCODE -eq 0) { $cloudOk = $true }
            python webstudio/tools/v89_public_probe.py --origin 'https://nineeye.github.io/webstudio/' --output "$pages"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true }
            if ($cloudOk -and $pagesOk) { break }
            if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
          }
          if (-not $cloudOk -and -not $pagesOk) { throw 'HOLD: V89 latest homepage files not published at either owned origin.' }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V89_PUBLIC_ORIGIN=$origin"
          Write-Host ("V89 verified public origin: " + $origin)
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_ONLY: GitHub Pages V89 proved, Cloudflare old.' }
          if (-not $pagesOk) { Write-Host 'HOLD_GITHUB_PAGES_ONLY: Cloudflare V89 proved, GitHub Pages old.' }
          exit 0

      - name: V89 actual Windows Edge 4-link 6-section sales homepage, 12 sector clicks, mobile screenshots
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $out = Join-Path $root 'V89_WINDOWS_EDGE'
          $passed = $false
          for ($try = 1; $try -le 2; $try++) {
            python webstudio/tools/v89_edge_browser_qa.py --origin "$env:V89_PUBLIC_ORIGIN" --output "$out"
            if ($LASTEXITCODE -eq 0) { $passed = $true; break }
            Write-Host ("V89 retryable public Edge HOLD attempt " + $try + ": evidence saved; will rerun only once on a fresh isolated profile.")
            if ($try -lt 2) { Start-Sleep -Seconds 3 }
          }
          if (-not $passed) { throw 'HOLD: V89 actual Windows Edge public homepage or 12-sector links failed twice. See V89_WINDOWS_EDGE/V89_PUBLIC_EDGE_KO.txt.' }

      - name: V90 true owner HTTPS 6-file proof on Cloudflare and GitHub Pages
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $base 'V90_CLOUDFLARE'
          $pages = Join-Path $base 'V90_GITHUB_PAGES'
          $cloudOk = $false
          $pagesOk = $false
          for ($i = 1; $i -le 5; $i++) {
            python webstudio/tools/v90_public_probe.py --origin "https://allfileone-webstudio.pages.dev/" --output "$cloud"
            if ($LASTEXITCODE -eq 0) { $cloudOk = $true }
            python webstudio/tools/v90_public_probe.py --origin "https://nineeye.github.io/webstudio/" --output "$pages"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true }
            if ($cloudOk -and $pagesOk) { break }
            if ($i -lt 5) { Start-Sleep -Seconds 9 }
          }
          if (-not $cloudOk -and -not $pagesOk) {
            throw 'HOLD: V90 exact six public files failed at both owner public HTTPS origins.'
          }
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_V90_ONLY: GitHub Pages verified, Cloudflare still stale.' }
          if (-not $pagesOk) { Write-Host 'HOLD_GITHUB_PAGES_V90_ONLY: Cloudflare verified, GitHub Pages still stale.' }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V90_PUBLIC_ORIGIN=$origin"
          Write-Host ('V90 actual public release verified at: ' + $origin)
          exit 0

      - name: V90 real Windows Edge buyer contract-readiness interaction screenshots
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $out = Join-Path $dir 'V90_WINDOWS_EDGE'
          python webstudio/tools/v90_edge_browser_qa.py --origin "$env:V90_PUBLIC_ORIGIN" --output "$out"
          if ($LASTEXITCODE -ne 0) {
            throw 'HOLD: V90 real Windows Edge buyer scope steps, 12-sector controls, or mobile checks failed.'
          }
          exit 0

      - name: V91 real buyer 7-file HTTPS proof at both owned origins with fail-closed fallback
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $cloud = Join-Path $dir 'V91_CLOUDFLARE'
          $pages = Join-Path $dir 'V91_GITHUB_PAGES'
          $cloudOk = $false
          $pagesOk = $false
          for ($i = 1; $i -le 6; $i++) {
            python webstudio/tools/v91_public_probe.py --origin 'https://allfileone-webstudio.pages.dev/' --output "$cloud"
            if ($LASTEXITCODE -eq 0) { $cloudOk = $true }
            python webstudio/tools/v91_public_probe.py --origin 'https://nineeye.github.io/webstudio/' --output "$pages"
            if ($LASTEXITCODE -eq 0) { $pagesOk = $true }
            if ($cloudOk -and $pagesOk) { break }
            if ($i -lt 6) { Start-Sleep -Seconds 9 }
          }
          if (-not $cloudOk -and -not $pagesOk) {
            throw 'HOLD: V91 seven exact public files are not live at either owner HTTPS origin.'
          }
          $origin = if ($cloudOk) { 'https://allfileone-webstudio.pages.dev/' } else { 'https://nineeye.github.io/webstudio/' }
          Add-Content -Path $env:GITHUB_ENV -Value "V91_PUBLIC_ORIGIN=$origin"
          Write-Host ('V91 public 7/7 source verified: ' + $origin)
          if (-not $cloudOk) { Write-Host 'HOLD_CLOUDFLARE_ONLY: GitHub Pages V91 is independent; Cloudflare V91 not proven.' }
          if (-not $pagesOk) { Write-Host 'HOLD_GITHUB_PAGES_ONLY: Cloudflare V91 verified; GitHub Pages V91 not proven.' }
          exit 0

      - name: V91 Windows Edge buyer scope draft, 12 sector x 3 style x PC/mobile and screenshots
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'AFO_WebStudio_V82_Evidence'
          $out = Join-Path $dir 'V91_WINDOWS_EDGE'
          $passed = $false
          for ($i = 1; $i -le 2; $i++) {
            python webstudio/tools/v91_edge_public_qa.py --origin "$env:V91_PUBLIC_ORIGIN" --output "$out"
            if ($LASTEXITCODE -eq 0) { $passed = $true; break }
            if ($i -lt 2) { Start-Sleep -Seconds 3 }
          }
          if (-not $passed) {
            throw 'HOLD: V91 actual owner public Windows Edge draft selection, responsive layout or content proof failed. See V91_WINDOWS_EDGE/V91_EDGE_KO.txt.'
          }
          exit 0

      - name: Upload source and public site evidence even when Cloudflare is HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AFO_WebStudio_V82_Public_Release_Evidence
          path: ${{ runner.temp }}/AFO_WebStudio_V82_Evidence/
          if-no-files-found: warn
          retention-days: 1